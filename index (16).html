const $=s=>document.querySelector(s),K='ev2_v1',today=new Date().toISOString().slice(0,10);

const lk=(u,i)=>u+'.'+(i+1);
const sd=(u,i,s)=>!!S.done[lk(u,i)+'|'+s];
function fin(u,i,s){const k=lk(u,i)+'|'+s;if(!S.done[k]){S.done[k]=1;S.log.push({d:today,t:k})}save()}
function lp(u,i){const st=STEPS[KIND[i]];return[st.filter(s=>sd(u,i,s)).length,st.length]}
const ldone=(u,i)=>{const[x,y]=lp(u,i);return x==y};
function up(u){let a=0,b=0;for(let i=0;i<5;i++){const[x,y]=lp(u,i);a+=x;b+=y}return[a,b]}
function nextL(){for(let k=0;k<12;k++){const u=((S.start-1+k)%12)+1;for(let i=0;i<5;i++)if(!ldone(u,i))return[u,i]}return null}

function quiz(el,items,done){let i=0,ok=0,res=[];

function vocQ(key,n){const w=VOC[key].w.map(x=>x.split('|'));return shuf(w).slice(0,Math.min(n,w.length)).map((p,i)=>{const op=shuf([p,...shuf(w.filter(x=>x!==p)).slice(0,2)]),idx=op.indexOf(p);

function mix(a,b,n){let p=[];for(let u=a;u<=b;u++){const d=U[u-1];d.g.forEach(g=>p.push(...shuf(GR[g].q).slice(0,2)));d.v.forEach(v=>p.push(...vocQ(v,3)));p.push(...shuf(d.fq).slice(0,1).map(x=>[...x,'اللغة الوظيفية']))}return shuf(p).slice(0,n)}

async function coach(kind,text,box,sk,u,i,step){box.className='card out';

const r=await ai(`You are a kind English coach for an adult Arabic-speaking learner at CEFR A2 using the book Evolve 2. ${ctx(u,i)} Use very simple English and add a short Arabic explanation for each rule. Learner's ${kind}:\n"""${text}"""\nReply in plain text with sections: SCORE: n/10 | CORRECTIONS: "my sentence -> correction -> why (with Arabic)" | BETTER VERSION | USED FROM THE LESSON: which target grammar/vocabulary the learner used | MINI PRACTICE: 3 short questions on my mistakes (no answers) | and a last line exactly "TAGS: " plus up to 3 grammar names copied exactly from this list: [${tags}].`);
box.textContent=r;const s=r.match(/(\d+(?:\.\d+)?)\s*\/\s*10/);if(s)bump(sk,Math.min(1,s[1]/10));
const t=r.match(/TAGS:\s*(.*)/);if(t)t[1].split(/[,;]/).map(x=>x.trim()).filter(x=>Object.values(GR).some(g=>g.n==x)).forEach(mist);
fin(u,i,step);box.insertAdjacentHTML('afterend','<div id="nxs"></div>');nxt($('#nxs'),u,i,step)}
catch(e){const n=text.trim().split(/\s+/).filter(Boolean).length;
box.textContent=`المدرّب الذكي غير متاح هنا، استخدم هذه القائمة للتصحيح الذاتي:\n✔ عدد الكلمات: ${n}\n✔ هل بدأت كل جملة بحرف كبير وانتهت بنقطة؟\n✔ هل الأزمنة صحيحة؟\n✔ هل استخدمت قاعدة الدرس وكلماته؟\nاقرأ نصّك بصوت عالٍ وصحّح شيئين.`;
bump(sk,Math.min(1,n/40)*.7);fin(u,i,step);box.insertAdjacentHTML('afterend','<div id="nxs"></div>');nxt($('#nxs'),u,i,step)}}
